[package]
name = "rinka-host"
description = "Rinka native playback host: wallpaper surfaces and the control socket"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rinka-engine.workspace = true
rinka-import = { path = "../rinka-import" }
wgpu = { workspace = true, features = ["std", "wgsl", "vulkan", "gles", "dx12"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
pollster.workspace = true
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
raw-window-handle = "0.6"
winit = "0.30"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
wayland-backend = { version = "0.3", features = ["client_system"] }

[target.'cfg(any(target_os = "linux", windows))'.dependencies]
# The same software decoder on both hosts; RGB conversion stays in the engine.
ffmpeg-next = { version = "9", default-features = false, features = ["format", "software-scaling"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# Pure Rust, so cross-checking for Windows from Linux still works.
embed-manifest = "1.4"

